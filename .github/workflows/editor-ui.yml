name: Editor UI regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/bettertick/ui/screens/tasks/components/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/editor-ui.yml'
      - 'scripts/emit-ui-snapshots.py'
      - 'scripts/run-editor-ui.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-ui:
    name: Editor UI & keyboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real editor and keyboard regression tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-editor-ui.sh
      - name: Upload editor UI reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-ui-report
          path: |
            app/build/reports/androidTests/
            app/build/reports/ui-regression/
            app/build/outputs/androidTest-results/
          retention-days: 7
