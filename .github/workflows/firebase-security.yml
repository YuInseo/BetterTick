name: Firebase Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Firestore Rules & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed server secrets
        run: python3 scripts/check-secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install security test dependencies
        working-directory: security-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test security rules using an isolated demo project
        working-directory: security-tests
        run: npm test
