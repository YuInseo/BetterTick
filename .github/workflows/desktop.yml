name: Desktop (Tauri)

# PC app lives in desktop/ on the `pc` branch. Every push runs the Rust tests
# and builds the Windows installer. (Tests run on Windows: no apt mirror needed.)
on:
  push:
    branches: [ pc ]
    paths: [ "desktop/**", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests + Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      # generate_context! embeds dist/, so build the frontend before cargo test.
      - run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build (NSIS installer)
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: BetterTick-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
