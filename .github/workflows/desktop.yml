name: Desktop (Tauri)

# PC app lives in desktop/ on the `pc` branch. Every push builds the
# Windows installer and runs the Rust tests.
on:
  push:
    branches: [ pc ]
    paths: [ "desktop/**", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          # man-db's index rebuild can stall apt on hosted runners for ages.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Build (NSIS installer)
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: BetterTick-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
