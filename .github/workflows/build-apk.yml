name: Build Debug APK

# main에 push할 때마다 자동으로 debug APK를 빌드해서
# `latest-debug` 태그의 GitHub Release에 덮어쓴다.
# 서명/Secrets 불필요 — push만 하면 끝.
#
# 다운로드 (로그인 불필요):
# https://github.com/YuInseo/BetterTick/releases/download/latest-debug/BetterTick.apk

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'build-logs/**'
      - '**/*.md'
  workflow_dispatch:

# 연속으로 push하면 진행 중이던 이전 빌드를 취소하고 최신만 빌드한다.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Android build
        uses: ./.github/actions/android-build

      - name: Compute version metadata
        id: meta
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          # 표시용 이름: 마지막 자리는 두 자리(0~99)까지만 쓰고 넘치면 가운데로 올린다.
          # versionCode(=CODE)는 그대로라 업데이트 비교에는 영향 없음.
          # 예) 193 → 0.1.93, 200 → 0.2.0, 1234 → 0.12.34
          NAME="0.$((CODE / 100)).$((CODE % 100))"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Will tag versionCode=$CODE versionName=$NAME sha=$SHA"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          # 빌드 시점에 versionCode/versionName 주입 → 산출 APK manifest와
          # version.json이 항상 일치 → AppUpdater의 versionCode 비교 정확.
          CI_VERSION_CODE: ${{ steps.meta.outputs.code }}
          CI_VERSION_NAME: ${{ steps.meta.outputs.name }}
          # Kakao 길찾기 REST API 키 → BuildConfig. 없으면 빈 값(빌드 정상, 직선 폴백).
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint -x test \
            --build-cache --parallel --console=plain 2>&1 | tee build.log
          echo "exit=$?" > build.exit

      - name: Show build log inline
        if: always()
        run: |
          echo "::group::build.log tail (last 200 lines)"
          tail -n 200 build.log || echo "no build.log"
          echo "::endgroup::"
          ls -la build*.log build.exit 2>/dev/null || true

      - name: Upload full build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Commit build log to build-logs branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          STATUS="${{ steps.build.outcome }}"

          # Do not switch the application checkout: local composite actions
          # must still exist when their cache post-steps run after publishing.
          LOG_WORKTREE=$(mktemp -d "$RUNNER_TEMP/bettertick-logs.XXXXXX")
          trap 'git worktree remove --force "$LOG_WORKTREE"' EXIT
          if git ls-remote --exit-code --heads origin build-logs >/dev/null 2>&1; then
            git fetch origin build-logs
            git worktree add --detach "$LOG_WORKTREE" FETCH_HEAD
          else
            git worktree add --detach "$LOG_WORKTREE" "$SHA"
            git -C "$LOG_WORKTREE" checkout --orphan build-logs
            git -C "$LOG_WORKTREE" rm -rf .
            echo "# Build logs branch" > "$LOG_WORKTREE/README.md"
          fi

          mkdir -p "$LOG_WORKTREE/runs"
          cp build.log "$LOG_WORKTREE/runs/${SHORT}.log" 2>/dev/null || echo "no build.log" > "$LOG_WORKTREE/runs/${SHORT}.log"
          cp build.exit "$LOG_WORKTREE/runs/${SHORT}.exit" 2>/dev/null || echo "exit=?" > "$LOG_WORKTREE/runs/${SHORT}.exit"
          echo "$STATUS" > "$LOG_WORKTREE/runs/${SHORT}.status"
          cp "$LOG_WORKTREE/runs/${SHORT}.log" "$LOG_WORKTREE/runs/latest.log"
          cp "$LOG_WORKTREE/runs/${SHORT}.exit" "$LOG_WORKTREE/runs/latest.exit"
          echo "$STATUS" > "$LOG_WORKTREE/runs/latest.status"
          echo "$SHA" > "$LOG_WORKTREE/runs/latest.sha"

          git -C "$LOG_WORKTREE" add README.md runs/
          git -C "$LOG_WORKTREE" commit -m "Build log ${SHORT} (${STATUS}) [skip ci]" || echo "nothing to commit"
          git -C "$LOG_WORKTREE" push origin HEAD:refs/heads/build-logs

      - name: Open issue with build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'No log captured.';
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              const tail = log.length > 50000 ? log.slice(-50000) : log;
              body = '```\n' + tail + '\n```';
            } catch (e) {
              body = 'Failed to read build.log: ' + String(e);
            }
            const sha = context.sha.substring(0, 7);
            try {
              const result = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build failure for ${sha}`,
                body: `Build failure for commit ${context.sha}\n\nLog also at: build-logs branch \`runs/${sha}.log\` and \`runs/latest.log\`.\n\nLast ~50KB:\n\n${body}`
              });
              core.notice(`Created issue #${result.data.number}`);
            } catch (err) {
              core.error('Issue creation failed: ' + (err.message || String(err)));
            }

      - name: Stage release assets
        if: steps.build.outcome == 'success'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BetterTick.apk
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.code }},
            "versionName": "${{ steps.meta.outputs.name }}",
            "sha": "${{ steps.meta.outputs.sha }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-debug/BetterTick.apk",
            "notes": "Auto build ${{ steps.meta.outputs.sha }}"
          }
          EOF
          cat version.json
          ls -la BetterTick.apk

      # 기존 release에 asset만 덮어쓰면 태그는 처음 커밋에, 게시일은 처음 날짜에
      # 그대로 남아 릴리즈 페이지에서 새 빌드가 안 올라간 것처럼 보인다.
      # 매번 release + 태그를 지우고 이번 커밋에서 새로 만든다.
      - name: Remove previous latest-debug release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "no previous latest-debug release"

      - name: Publish to GitHub Release (latest-debug)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          target_commitish: ${{ github.sha }}
          name: Latest Debug Build
          body: |
            Debug APK built automatically from the latest push to `main`.
            Version: ${{ steps.meta.outputs.name }} (code ${{ steps.meta.outputs.code }})
            Commit: ${{ steps.meta.outputs.sha }}

            Direct download (no login required):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/BetterTick.apk

            Smaller test build (same app, code shrunk with R8 — not used by auto-update yet):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/BetterTick-small.apk
          # version.json goes up in the next step, only after the APK has
          # finished uploading — the app treats version.json as "ready".
          files: |
            BetterTick.apk
          prerelease: true
          make_latest: "false"

      - name: Upload version.json (after APK)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-debug version.json --clobber --repo "$GITHUB_REPOSITORY"

      # 테스트용 작은 APK (R8 축소) — 일반 APK·version.json을 다 올린 뒤에 만든다.
      # R8은 오래 걸리므로 업데이트 배포를 늦추지 않게 맨 뒤에서, 실패해도 무시.
      - name: Build small test APK (R8)
        id: small
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CI_VERSION_CODE: ${{ steps.meta.outputs.code }}
          CI_VERSION_NAME: ${{ steps.meta.outputs.name }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleSmall -x lint -x test \
            --build-cache --parallel --console=plain 2>&1 | tail -n 80
          cp app/build/outputs/apk/small/app-small.apk BetterTick-small.apk
          ls -la BetterTick-small.apk

      - name: Upload small test APK
        if: steps.small.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-debug BetterTick-small.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Fail the job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - see build-logs branch and issues tab"
          exit 1
