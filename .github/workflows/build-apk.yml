name: Build Debug APK

# main에 push할 때마다 자동으로 debug APK를 빌드해서
# `latest-debug` 태그의 GitHub Release에 덮어쓴다.
# 서명/Secrets 불필요 — push만 하면 끝.
#
# 다운로드 (로그인 불필요):
# https://github.com/YuInseo/BetterTick/releases/download/latest-debug/BetterTick.apk

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'build-logs/**'
      - '**/*.md'
  workflow_dispatch:

# 연속으로 push하면 진행 중이던 이전 빌드를 취소하고 최신만 빌드한다.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-

      - name: Set up Gradle (deps cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          # gradle-home-cache-cleanup 비활성: post-action에서 Gradle 9.5.0
          # dummy cleanup build를 돌리는데, 해당 버전에서 cache 설정 API가
          # write-only로 바뀌어 실패함. 산출물엔 영향 없지만 빨간 X 노이즈.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Cache Android SDK + AGP build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
            ~/.gradle/caches/transforms-4
            app/build/intermediates/incremental
          key: android-build-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            android-build-cache-${{ runner.os }}-

      - name: Cache project build outputs
        uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/generated/ksp
            app/build/tmp/kotlin-classes
          key: project-build-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ github.ref_name }}-
            project-build-${{ runner.os }}-

      - name: Compute version metadata
        id: meta
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          # build.gradle.kts의 versionName 그대로 가져와서 commit count 붙임
          NAME="0.1.${CODE}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Will tag versionCode=$CODE versionName=$NAME sha=$SHA"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          # 빌드 시점에 versionCode/versionName 주입 → 산출 APK manifest와
          # version.json이 항상 일치 → AppUpdater의 versionCode 비교 정확.
          CI_VERSION_CODE: ${{ steps.meta.outputs.code }}
          CI_VERSION_NAME: ${{ steps.meta.outputs.name }}
          # Kakao 길찾기 REST API 키 → BuildConfig. 없으면 빈 값(빌드 정상, 직선 폴백).
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint -x test \
            --build-cache --parallel --daemon 2>&1 | tee build.log
          echo "exit=$?" > build.exit

      - name: Show build log inline
        if: always()
        run: |
          echo "::group::build.log tail (last 200 lines)"
          tail -n 200 build.log || echo "no build.log"
          echo "::endgroup::"
          ls -la build*.log build.exit 2>/dev/null || true

      - name: Upload full build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Commit build log to build-logs branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          STATUS="${{ steps.build.outcome }}"

          mkdir -p /tmp/log-stash
          cp build.log /tmp/log-stash/build.log 2>/dev/null || echo "no build.log" > /tmp/log-stash/build.log
          cp build.exit /tmp/log-stash/build.exit 2>/dev/null || echo "exit=?" > /tmp/log-stash/build.exit

          git stash -u 2>/dev/null || true

          if git ls-remote --exit-code --heads origin build-logs >/dev/null 2>&1; then
            git fetch origin build-logs:build-logs
            git checkout build-logs
          else
            git checkout --orphan build-logs
            git rm -rf . 2>/dev/null || true
            echo "# Build logs branch" > README.md
            git add README.md
            git commit -m "Init build-logs branch [skip ci]" || true
          fi

          mkdir -p runs
          cp /tmp/log-stash/build.log "runs/${SHORT}.log"
          cp /tmp/log-stash/build.exit "runs/${SHORT}.exit"
          echo "${STATUS}" > "runs/${SHORT}.status"
          cp /tmp/log-stash/build.log runs/latest.log
          cp /tmp/log-stash/build.exit runs/latest.exit
          echo "${STATUS}" > runs/latest.status
          echo "${SHA}" > runs/latest.sha

          git add runs/
          git commit -m "Build log ${SHORT} (${STATUS}) [skip ci]" || echo "nothing to commit"
          git push origin build-logs

      - name: Open issue with build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'No log captured.';
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              const tail = log.length > 50000 ? log.slice(-50000) : log;
              body = '```\n' + tail + '\n```';
            } catch (e) {
              body = 'Failed to read build.log: ' + String(e);
            }
            const sha = context.sha.substring(0, 7);
            try {
              const result = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build failure for ${sha}`,
                body: `Build failure for commit ${context.sha}\n\nLog also at: build-logs branch \`runs/${sha}.log\` and \`runs/latest.log\`.\n\nLast ~50KB:\n\n${body}`
              });
              core.notice(`Created issue #${result.data.number}`);
            } catch (err) {
              core.error('Issue creation failed: ' + (err.message || String(err)));
            }

      - name: Stage release assets
        if: steps.build.outcome == 'success'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BetterTick.apk
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.code }},
            "versionName": "${{ steps.meta.outputs.name }}",
            "sha": "${{ steps.meta.outputs.sha }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-debug/BetterTick.apk",
            "notes": "Auto build ${{ steps.meta.outputs.sha }}"
          }
          EOF
          cat version.json
          ls -la BetterTick.apk

      - name: Publish to GitHub Release (latest-debug)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            Debug APK built automatically from the latest push to `main`.
            Version: ${{ steps.meta.outputs.name }} (code ${{ steps.meta.outputs.code }})
            Commit: ${{ steps.meta.outputs.sha }}

            Direct download (no login required):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/BetterTick.apk
          files: |
            BetterTick.apk
            version.json
          prerelease: true
          make_latest: "false"

      - name: Fail the job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - see build-logs branch and issues tab"
          exit 1
