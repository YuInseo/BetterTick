name: Purge historical APKs

# One-off named branch creation; normal application pushes and PRs never run it.
on:
  create:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bettertick-apk-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'YuInseo/BetterTick' && github.ref == 'refs/heads/maintenance/purge-historical-apks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed history-cleanup tool
        run: python -m pip install git-filter-repo==2.47.0
      - name: Purge old Android binaries without losing newer work
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: python scripts/purge-historical-apks.py --execute
