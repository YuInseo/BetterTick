name: CI

# main push 시엔 build-apk.yml이 이미 assembleDebug + 배포까지 수행하므로
# 여기서 다시 빌드하지 않는다(중복 제거). 검증/lint는 PR에서만.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# PR에 새 커밋 오면 이전 빌드 자동 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    # 평소 5분 안팎. 러너가 멈추면 기본 6시간 대신 30분에 실패시킨다.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android build
        uses: ./.github/actions/android-build

      # One task graph and one set of BuildConfig inputs: do not reconfigure
      # and recompile with a different Kakao key between lint and assembly.
      - name: Build and lint debug APK
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: ./gradlew assembleDebug lintDebug --build-cache --parallel --console=plain

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
