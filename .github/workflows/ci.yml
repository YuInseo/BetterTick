name: CI

on:
  # 모든 브랜치 푸시에서 자동 빌드. PR은 포크에서 올라온 것만 추가로 도는 게
  # 의미 있고, 같은 리포 브랜치는 push 이벤트로 이미 빌드되니 중복 회피.
  push:
  pull_request:
    branches: [ main ]

# PR에 새 커밋 오면 이전 빌드 자동 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Gradle 캐시 (빌드 속도 50~70% 향상)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  notify-failure:
    name: File CI Failure Issue
    needs: build
    # 푸시 실패 + 같은 리포에서 올라온 PR 실패 모두 이슈를 만든다. 포크
    # PR은 GITHUB_TOKEN 이 read-only 라 어차피 생성에 실패하므로 스킵.
    if: |
      failure() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue with run link
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const fullSha = isPR
              ? context.payload.pull_request.head.sha
              : context.sha;
            const sha = fullSha.slice(0, 7);
            const branch = isPR
              ? context.payload.pull_request.head.ref
              : context.ref.replace('refs/heads/', '');
            const prNumber = isPR ? context.payload.pull_request.number : null;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = isPR
              ? `CI 실패: PR #${prNumber} @ ${sha}`
              : `CI 실패: ${sha} (${branch})`;

            // 같은 커밋에 대해 이미 열린 이슈가 있으면 추가 생성하지 않는다.
            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ci-failure in:title ${sha}`,
            });
            if (existing.total_count > 0) {
              core.info(`Issue for ${sha} already open: ${existing.items[0].html_url}`);
              return;
            }

            // 실패한 잡과 스텝 목록을 본문에 포함해서 어디서 깨졌는지 한눈에 보이게.
            const { data: jobsResp } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedJobs = jobsResp.jobs.filter(j => j.conclusion === 'failure');
            const jobsMd = failedJobs.length === 0
              ? '_(실패한 잡 정보를 가져오지 못했습니다)_'
              : failedJobs.map(j => {
                  const failedSteps = (j.steps || [])
                    .filter(s => s.conclusion === 'failure')
                    .map(s => `\`${s.name}\``)
                    .join(', ') || '_(스텝 미상)_';
                  return `- **${j.name}** → ${failedSteps}\n  ${j.html_url}`;
                }).join('\n');

            const rows = [
              `| 커밋 | \`${fullSha}\` |`,
              `| 브랜치 | \`${branch}\` |`,
              `| 트리거 | \`${context.eventName}\` by @${context.actor} |`,
              `| 실행 로그 | ${runUrl} |`,
            ];
            if (isPR) {
              rows.unshift(`| PR | #${prNumber} ${context.payload.pull_request.html_url} |`);
            }

            const body = [
              `워크플로 **${context.workflow}** 가 \`${branch}\` 에서 실패했습니다.`,
              ``,
              `| 항목 | 값 |`,
              `| --- | --- |`,
              ...rows,
              ``,
              `### 실패한 잡`,
              jobsMd,
              ``,
              `Lint 리포트와 빌드 산출물은 위 실행 페이지의 Artifacts 섹션에서 받을 수 있습니다.`,
              ``,
              `<sub>이 이슈는 \`.github/workflows/ci.yml\` 의 \`notify-failure\` 잡이 자동으로 생성했습니다. 수정 후 새 커밋이 통과하면 수동으로 닫아주세요.</sub>`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure'],
            });
            core.info(`Opened ${issue.html_url}`);
