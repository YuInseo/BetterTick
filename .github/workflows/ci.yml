name: CI

# main push 시엔 build-apk.yml이 이미 assembleDebug + 배포까지 수행하므로
# 여기서 다시 빌드하지 않는다(중복 제거). 검증/lint는 PR에서만.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# PR에 새 커밋 오면 이전 빌드 자동 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    # 평소 5분 안팎. 러너가 멈추면 기본 6시간 대신 30분에 실패시킨다.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android build
        uses: ./.github/actions/android-build

      # Build, lint and unit tests share one Gradle task graph.
      - name: Build and lint debug APK
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --build-cache --parallel --console=plain

      - name: Verify APK has no location permissions or tracking service
        run: python3 scripts/check-no-location.py

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
