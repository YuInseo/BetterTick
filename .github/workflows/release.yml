name: Release

# 자동 릴리스 트리거:
#   1. main 푸시 → app/build.gradle.kts 의 versionName 으로 v$ver 태그를
#      자동 생성. 같은 버전 릴리스가 이미 있으면 스킵.
#   2. v*.*.* 태그를 직접 푸시 — 명시적 릴리스 절차.
#   3. Actions UI 'Run workflow' 버튼 — 임의 태그 입력으로 즉시 실행.
on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.1.3)'
        required: true
        default: 'v0.1.3'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 어떤 트리거든 여기서 태그/버전을 결정하고, 같은 릴리스가 이미
      # 있으면 should_release=false 로 떨어뜨려 이후 비싼 빌드 단계를 모두
      # 스킵한다. main 푸시 자동 흐름이 매번 같은 버전을 다시 빌드하지
      # 않게 하기 위함.
      - name: Resolve tag and decide release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # main 푸시 — versionName 으로 자동 태그
            ver=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts \
                    | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            tag="v$ver"
          fi
          name="${tag#v}"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # 이미 동일 태그/릴리스가 존재하면 자동 흐름은 no-op.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "릴리스 $tag 가 이미 존재 — 스킵."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        if: steps.version.outputs.should_release == 'true'
        run: chmod +x gradlew

      - name: Cache Gradle packages
        if: steps.version.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # GitHub Secret에서 키스토어 복원
      - name: Decode Keystore
        if: steps.version.outputs.should_release == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bettertick.keystore

      - name: Build Release APK
        if: steps.version.outputs.should_release == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        if: steps.version.outputs.should_release == 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk

      # 태그가 원격에 없으면 action-gh-release@v2 가 현재 커밋으로 만들어
      # 붙인다. 이미 있는 태그면 그 태그에 그대로 릴리스를 생성.
      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BetterTick ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          draft: false

  notify-failure:
    name: File Release Failure Issue
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue with run link
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.inputs?.tag
              || context.ref.replace('refs/tags/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release 실패: ${tag}`;

            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ci-failure in:title ${tag}`,
            });
            if (existing.total_count > 0) {
              core.info(`Issue for ${tag} already open: ${existing.items[0].html_url}`);
              return;
            }

            const { data: jobsResp } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedJobs = jobsResp.jobs.filter(j => j.conclusion === 'failure');
            const jobsMd = failedJobs.length === 0
              ? '_(실패한 잡 정보를 가져오지 못했습니다)_'
              : failedJobs.map(j => {
                  const failedSteps = (j.steps || [])
                    .filter(s => s.conclusion === 'failure')
                    .map(s => `\`${s.name}\``)
                    .join(', ') || '_(스텝 미상)_';
                  return `- **${j.name}** → ${failedSteps}\n  ${j.html_url}`;
                }).join('\n');

            const body = [
              `릴리스 빌드(\`${tag}\`)가 실패해서 GitHub Release가 생성되지 않았습니다.`,
              ``,
              `| 항목 | 값 |`,
              `| --- | --- |`,
              `| 태그 | \`${tag}\` |`,
              `| 커밋 | \`${context.sha}\` |`,
              `| 트리거 | @${context.actor} |`,
              `| 실행 로그 | ${runUrl} |`,
              ``,
              `### 실패한 잡`,
              jobsMd,
              ``,
              `키스토어 시크릿 또는 \`assembleRelease\` 가 깨졌을 가능성이 큽니다. 수정 후 동일 태그를 재푸시하려면 먼저 원격 태그를 삭제하세요.`,
              ``,
              `<sub>이 이슈는 \`.github/workflows/release.yml\` 의 \`notify-failure\` 잡이 자동 생성했습니다.</sub>`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'release'],
            });
            core.info(`Opened ${issue.html_url}`);
