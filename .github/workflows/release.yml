name: Release

# v1.0.0 형식의 태그 push 시 자동 실행
# 사용법: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # GitHub Secret에서 키스토어 복원
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bettertick.keystore

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Kakao 길찾기 REST API 키 → BuildConfig. 없으면 빈 값(빌드 정상, 직선 폴백).
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: ./gradlew assembleRelease

      # 태그명에서 버전 추출 (v1.0.0 → 1.0.0)
      - name: Get version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk

      # GitHub Releases 페이지에 APK 자동 첨부
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BetterTick ${{ github.ref_name }}
          files: app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          draft: false
