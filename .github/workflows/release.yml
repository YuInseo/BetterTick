name: Release

# v1.0.0 형식의 태그 push 시 자동 실행
# 사용법: git tag v1.0.0 && git push origin v1.0.0
# 또는 GitHub Actions UI에서 'Run workflow' 버튼으로 임의 태그를 입력해 즉시 실행.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.1.3) — 미존재 태그면 워크플로가 push 후 사용'
        required: true
        default: 'v0.1.3'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # GitHub Secret에서 키스토어 복원
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/bettertick.keystore

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 태그/버전 결정. push:tag 일 땐 ref_name(v1.0.0), workflow_dispatch
      # 일 땐 입력값. v 접두사 떼서 파일명용 버전도 함께 노출.
      - name: Resolve tag and version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk

      # GitHub Releases 페이지에 APK 자동 첨부. 태그가 아직 원격에 없는
      # 경우(workflow_dispatch) action-gh-release@v2 가 현재 커밋으로
      # 태그를 만들어 붙인다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BetterTick ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/BetterTick-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          draft: false

  notify-failure:
    name: File Release Failure Issue
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue with run link
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.inputs?.tag
              || context.ref.replace('refs/tags/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release 실패: ${tag}`;

            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ci-failure in:title ${tag}`,
            });
            if (existing.total_count > 0) {
              core.info(`Issue for ${tag} already open: ${existing.items[0].html_url}`);
              return;
            }

            const { data: jobsResp } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedJobs = jobsResp.jobs.filter(j => j.conclusion === 'failure');
            const jobsMd = failedJobs.length === 0
              ? '_(실패한 잡 정보를 가져오지 못했습니다)_'
              : failedJobs.map(j => {
                  const failedSteps = (j.steps || [])
                    .filter(s => s.conclusion === 'failure')
                    .map(s => `\`${s.name}\``)
                    .join(', ') || '_(스텝 미상)_';
                  return `- **${j.name}** → ${failedSteps}\n  ${j.html_url}`;
                }).join('\n');

            const body = [
              `릴리스 빌드(\`${tag}\`)가 실패해서 GitHub Release가 생성되지 않았습니다.`,
              ``,
              `| 항목 | 값 |`,
              `| --- | --- |`,
              `| 태그 | \`${tag}\` |`,
              `| 커밋 | \`${context.sha}\` |`,
              `| 트리거 | @${context.actor} |`,
              `| 실행 로그 | ${runUrl} |`,
              ``,
              `### 실패한 잡`,
              jobsMd,
              ``,
              `키스토어 시크릿 또는 \`assembleRelease\` 가 깨졌을 가능성이 큽니다. 수정 후 동일 태그를 재푸시하려면 먼저 원격 태그를 삭제하세요.`,
              ``,
              `<sub>이 이슈는 \`.github/workflows/release.yml\` 의 \`notify-failure\` 잡이 자동 생성했습니다.</sub>`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'release'],
            });
            core.info(`Opened ${issue.html_url}`);
